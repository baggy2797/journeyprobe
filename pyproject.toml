[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "journeyprobe"
version = "0.1.0"
description = "An LLM authors persona-based user-journey tests as a reviewable YAML plan; Playwright replays them deterministically."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "baggy2797" }]
keywords = ["testing", "playwright", "llm", "e2e", "test-automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.6,<3",
  "typer>=0.12",
  "pyyaml>=6",
  "playwright>=1.44",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML",
  "openai>=1.40",
]

[project.scripts]
journeyprobe = "journeyprobe.cli:app"

[project.urls]
Source = "https://github.com/baggy2797/journeyprobe"

[tool.hatch.build.targets.wheel]
packages = ["src/journeyprobe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=journeyprobe --cov-report=term-missing --cov-fail-under=80"
markers = ["integration: runs a real browser against the local fixture shop"]

[tool.coverage.run]
branch = true
concurrency = ["greenlet", "thread"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # typer uses function-call defaults

[tool.mypy]
strict = true
python_version = "3.10"
plugins = ["pydantic.mypy"]
