name: journeyprobe
description: Replay a reviewed journeyprobe YAML plan with Playwright (no LLM at run time) and upload JUnit/HTML reports.
branding:
  icon: check-circle
  color: green
inputs:
  plan:
    description: Path to the plan YAML.
    required: true
  site:
    description: Path to the site profile YAML.
    required: true
  base-url:
    description: Override the profile base_url (e.g. a preview deployment).
    required: false
    default: ""
  report-dir:
    description: Directory for junit.xml, report.html, screenshots and traces.
    required: false
    default: jp-report
  python-version:
    description: Python version to use.
    required: false
    default: "3.13"
  upload-artifact:
    description: Upload the report directory as a workflow artifact.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install journeyprobe from this action's own ref
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        python -m pip install "$ACTION_PATH"
        python -m playwright install --with-deps chromium
    - name: Replay plan
      shell: bash
      env:
        JP_PLAN: ${{ inputs.plan }}
        JP_SITE: ${{ inputs.site }}
        JP_BASE_URL: ${{ inputs.base-url }}
        JP_OUT: ${{ inputs.report-dir }}
      run: |
        args=(run "$JP_PLAN" --site "$JP_SITE" --out-dir "$JP_OUT")
        if [ -n "$JP_BASE_URL" ]; then args+=(--base-url "$JP_BASE_URL"); fi
        journeyprobe "${args[@]}"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ always() && inputs.upload-artifact == 'true' }}
      with:
        name: journeyprobe-report
        path: ${{ inputs.report-dir }}
        if-no-files-found: ignore
